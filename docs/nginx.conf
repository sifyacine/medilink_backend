# =============================================================================
# Nginx configuration for MediLink
# Domain : dzmedilink.duckdns.org
# Stack  : Gunicorn (HTTP/WSGI) on 127.0.0.1:8000
#          Daphne  (WebSocket/ASGI) on 127.0.0.1:8001
#
# One-time setup on the server before enabling this config:
#
#   sudo mkdir -p /var/www/medilink/staticfiles /var/www/medilink/media
#   sudo chown -R django:www-data /var/www/medilink
#   sudo chmod -R 755 /var/www/medilink
#
#   Then collect static:
#   cd /home/django/backend/medilink_backend
#   source venv/bin/activate
#   DJANGO_SETTINGS_MODULE=core.settings.production python manage.py collectstatic --noinput
#
# Install:
#   sudo cp nginx.conf /etc/nginx/sites-available/medilink
#   sudo ln -sf /etc/nginx/sites-available/medilink /etc/nginx/sites-enabled/medilink
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

upstream django_http {
    server 127.0.0.1:8000 fail_timeout=0;
}

upstream django_ws {
    server 127.0.0.1:8001 fail_timeout=0;
}

# ---------------------------------------------------------------------------
# HTTP — redirect everything to HTTPS
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name dzmedilink.duckdns.org;

    # Certbot ACME challenge (must come before the redirect)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------------------------------------------------------------------------
# HTTPS — main server block
# ---------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dzmedilink.duckdns.org;

    # ---- SSL (Certbot manages these paths) ----
    ssl_certificate     /etc/letsencrypt/live/dzmedilink.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dzmedilink.duckdns.org/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ---- Security headers ----
    add_header X-Frame-Options           DENY                             always;
    add_header X-Content-Type-Options    nosniff                          always;
    add_header X-XSS-Protection          "1; mode=block"                  always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ---- Upload size limit ----
    client_max_body_size 20M;

    # ---- Static files (/var/www/medilink/staticfiles/) ----
    location /static/ {
        alias   /var/www/medilink/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- Media files (/var/www/medilink/media/) ----
    location /media/ {
        alias   /var/www/medilink/media/;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ---- WebSocket (/ws/...) → Daphne on 8001 ----
    location /ws/ {
        proxy_pass         http://django_ws;
        proxy_http_version 1.1;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout    86400s;
        proxy_send_timeout    86400s;
        proxy_connect_timeout 75s;
    }

    # ---- API + everything else → Gunicorn on 8000 ----
    location / {
        proxy_pass         http://django_http;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 75s;
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
    }
}
